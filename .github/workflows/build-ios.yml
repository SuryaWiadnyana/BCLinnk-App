name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: List Schemes
        run: |
          xcodebuild -list -project BclinnkApp.xcodeproj

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project BclinnkApp.xcodeproj \
            -scheme BclinnkApp \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/BclinnkApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -configuration Release

      - name: Verify Archive Structure
        run: |
          echo "=== Applications in Archive ==="
          ls -la ${{ github.workspace }}/build/BclinnkApp.xcarchive/Products/Applications/

      - name: Package Unsigned IPA
        run: |
          mkdir -p ${{ github.workspace }}/build/Payload
          cp -r "${{ github.workspace }}/build/BclinnkApp.xcarchive/Products/Applications/BclinnkApp.app" \
                "${{ github.workspace }}/build/Payload/"
          cd ${{ github.workspace }}/build
          zip -qr BclinnkApp-unsigned.ipa Payload
          echo "=== IPA created successfully ==="
          ls -lh BclinnkApp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-unsigned-ipa
          path: build/BclinnkApp-unsigned.ipa
          retention-days: 30

      - name: Upload xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-xcarchive
          path: build/BclinnkApp.xcarchive
          retention-days: 30
