name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (Device & Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: List Schemes
        run: |
          xcodebuild -list -project BclinnkApp.xcodeproj

      # --- 1. BUILD UNTUK PERANGKAT FISIK (IPA) ---
      - name: Build Archive (Physical Device)
        run: |
          xcodebuild archive \
            -project BclinnkApp.xcodeproj \
            -scheme BclinnkApp \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/BclinnkApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -configuration Release

      - name: Package Unsigned IPA
        run: |
          mkdir -p ${{ github.workspace }}/build/Payload
          cp -r "${{ github.workspace }}/build/BclinnkApp.xcarchive/Products/Applications/BclinnkApp.app" \
                "${{ github.workspace }}/build/Payload/"
          cd ${{ github.workspace }}/build
          zip -qr BclinnkApp-unsigned.ipa Payload
          echo "=== IPA created successfully ==="
          ls -lh BclinnkApp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-unsigned-ipa
          path: build/BclinnkApp-unsigned.ipa
          retention-days: 30

      # --- 2. BUILD UNTUK SIMULATOR (APPETIZE.IO) ---
      - name: Build for iOS Simulator (Appetize.io)
        run: |
          xcodebuild build \
            -project BclinnkApp.xcodeproj \
            -scheme BclinnkApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath ${{ github.workspace }}/build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Simulator App for Appetize.io
        run: |
          cd ${{ github.workspace }}/build/derivedData/Build/Products/Release-iphonesimulator
          zip -qr ${{ github.workspace }}/build/BclinnkApp-simulator.zip BclinnkApp.app
          echo "=== Simulator ZIP created successfully for Appetize ==="
          ls -lh ${{ github.workspace }}/build/BclinnkApp-simulator.zip

      - name: Upload Simulator Artifact (Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-simulator-appetize
          path: build/BclinnkApp-simulator.zip
          retention-days: 30

      - name: Upload xcarchive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-xcarchive
          path: build/BclinnkApp.xcarchive
          retention-days: 30
