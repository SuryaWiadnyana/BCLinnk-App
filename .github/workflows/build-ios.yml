name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned .xcarchive
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Resolve Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project BclinnkApp.xcodeproj \
            -scheme BclinnkApp

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project BclinnkApp.xcodeproj \
            -scheme BclinnkApp \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ github.workspace }}/build/BclinnkApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -configuration Release \
            -quiet

      - name: Verify Archive
        run: |
          echo "--- Archive Contents ---"
          ls -la ${{ github.workspace }}/build/BclinnkApp.xcarchive/Products/Applications/
          echo ""
          echo "--- Info.plist ---"
          cat ${{ github.workspace }}/build/BclinnkApp.xcarchive/Info.plist

      - name: Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-xcarchive
          path: build/BclinnkApp.xcarchive
          retention-days: 30

      - name: Create unsigned IPA
        run: |
          mkdir -p ${{ github.workspace }}/build/Payload
          cp -r ${{ github.workspace }}/build/BclinnkApp.xcarchive/Products/Applications/BclinnkApp.app \
                ${{ github.workspace }}/build/Payload/
          cd ${{ github.workspace }}/build
          zip -r BclinnkApp-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BclinnkApp-unsigned-ipa
          path: build/BclinnkApp-unsigned.ipa
          retention-days: 30

